name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: web, arch: amd64, platform: linux/amd64 }
          - { service: web, arch: arm64, platform: linux/arm64 }
          - { service: bff, arch: amd64, platform: linux/amd64 }
          - { service: bff, arch: arm64, platform: linux/arm64 }

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image base name
        run: echo "IMAGE_BASE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes per-arch tags on main; PRs only validate the Dockerfiles.
      # The merge job combines the per-arch tags into final multi-arch tags.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest-${{ matrix.arch }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:sha-${{ env.SHA_SHORT }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
          provenance: false

  merge:
    name: merge ${{ matrix.service }}
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [web, bff]

    steps:
      - name: Resolve image base name
        run: echo "IMAGE_BASE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into multi-arch tags
        run: >
          docker buildx imagetools create
          -t "${IMAGE_BASE}/${MATRIX_SERVICE}:latest"
          -t "${IMAGE_BASE}/${MATRIX_SERVICE}:sha-${SHA_SHORT}"
          "${IMAGE_BASE}/${MATRIX_SERVICE}:latest-amd64"
          "${IMAGE_BASE}/${MATRIX_SERVICE}:latest-arm64"
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
